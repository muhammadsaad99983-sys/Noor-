.card{background:var(--cd);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 8px #0002}

select{padding:10px;border-radius:10px;font-size:16px;background:var(--cd);color:var(--tx);border:1px solid #0004;width:100%;margin:6px 0}
.dua{display:flex;align-items:center;gap:10px;border-radius:16px;padding:14px;margin:10px 0;color:#12302f;cursor:pointer}.dua .e{font-size:44px}
.dua .x{display:none;width:100%}.dua.o .x{display:block}.dua{flex-wrap:wrap}

   if(+x>now)Ls.push({id:k*10+i,t:+x,n:t('p')[i],o:0});if(D.rm&&x-D.rm*6e4>now)Ls.push({id:100+k*10+i,t:x-D.rm*6e4,n:t('p')[i],o:D.rm})})}catch(e){}}
 Android.schedule(JSON.stringify(Ls))}
let GA=null,AU=null,WL=null;const FR={};
addEventListener('click',()=>{try{GA=GA||new(window.AudioContext||webkitAudioContext)();GA.resume()}catch(e){}},{once:true});
const idb=(m,v)=>new Promise((ok,no)=>{const q=indexedDB.open('noor',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>{const st=q.result.transaction('f',m=='get'?'readonly':'readwrite').objectStore('f'),rq=m=='get'?st.get('a'):st.put(v,'a');rq.onsuccess=()=>ok(rq.result);rq.onerror=no};q.onerror=no});
async function setA(f){if(f){await idb('put',f);alert('✔')}}
function beep(){try{const a=GA||new(window.AudioContext||webkitAudioContext)(),t0=a.currentTime;[523,659,784,659,523,659,784,1046].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,t0+i*.7);g.gain.exponentialRampToValueAtTime(.001,t0+i*.7+.65);o.start(t0+i*.7);o.stop(t0+i*.7+.7)})}catch(e){}}
async function play(){stopA(1);const b=await idb('get').catch(()=>null);if(b){AU=new Audio(URL.createObjectURL(b));AU.play().catch(()=>beep())}else beep()}
function stopA(k){if(AU){AU.pause();AU=null}if(!k)$('#ab').style.display='none'}
async function wake(){try{if(D.wl&&navigator.wakeLock)WL=await navigator.wakeLock.request('screen');else if(WL){WL.release();WL=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
function sync(){window.Android&&TM&&Android.schedule(JSON.stringify({t:TM.t,al:D.al,rm:D.rm}))}
function ring(k,ty,off){const nm=t('p')[P.indexOf(k)],msg=ty=='adhan'?`🕌 ${nm} — ${t('tm')}`:`⏰ ${nm} — ${off} ${t('mn')} ${t('left')}`;
 $('#at').textContent=msg;$('#ab').style.display='block';if(ty=='adhan')play();else navigator.vibrate&&navigator.vibrate([200,100,200]);
 if(window.Notification&&Notification.permission=='granted')navigator.serviceWorker.ready.then(x=>x.showNotification(msg,{icon:'icon-192.png',vibrate:[300,100,300],tag:k+ty})).catch(()=>{})}
function chk(n){if(!TM||window.Android)return;P.forEach((k,i)=>{if(i==1||!D.al[k])return;const[h,m]=TM.t[k].split(':'),d=new Date(n);d.setHours(+h,+m,0,0);
 [[0,'adhan'],[D.rm,'rem']].forEach(([off,ty])=>{if(ty=='rem'&&!off)return;const at=d-off*6e4,id=n.toDateString()+k+ty;if(n>=at&&n-at<60000&&!FR[id]){FR[id]=1;ring(k,ty,off)}})})}
function alUI(){const ps=['Fajr','Dhuhr','Asr','Maghrib','Isha'],nm=t('p');
 return `<hr><b>🔔 ${t('al')}</b>`+ps.map(k=>`<div class="row"><span>${nm[P.indexOf(k)]}</span><input type="checkbox" ${D.al[k]?'checked':''} onchange="D.al['${k}']=+this.checked;sv();sched()"></div>`).join('')+
 `<label>${t('rm')}</label><select onchange="D.rm=+this.value;sv();sched()">${[0,5,10,15,30].map(m=>`<option value="${m}" ${m==D.rm?'selected':''}>${m} ${t('mn')}</option>`).join('')}</select>
 <label>${t('au')}</label><input type="file" accept="audio/*" onchange="setA(this.files[0])">
 <button class="btn" onclick="play()">▶ ${t('ts')}</button> <button class="btn" style="background:#b5483a" onclick="stopA()">⏹</button> <button class="btn" style="background:#777" onclick="idb('put',null).then(()=>alert('OK'))">↺</button>
 <div class="row"><span>${t('wl')}</span><input type="checkbox" ${D.wl?'checked':''} onchange="D.wl=+this.checked;sv();wake()"></div>
 <button class="btn" onclick="Notification.requestPermission().then(p=>alert(p))">${t('nt')}</button>`}
let CD=JSON.parse(Q.cd||'[]');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function addUI(){return `<button class="btn" style="width:100%" onclick="const f=$('#af');f.style.display=f.style.display=='block'?'none':'block'">＋ ${t('ad')}</button>
<div class="card" id="af" style="display:none"><input type="text" id="ft" placeholder="${t('ti')}"><textarea id="fa" class="ar" dir="rtl" rows="3" placeholder="عربی"></textarea><textarea id="fr" rows="2" placeholder="${t('tr')}"></textarea><input type="file" id="fi" accept="image/*"><button class="btn" onclick="addD()">${t('sa')}</button></div>`}
function shrink(f){return new Promise(ok=>{const i=new Image();i.onload=()=>{const k=Math.min(1,400/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=URL.createObjectURL(f)})}
async function addD(){const ti=$('#ft').value.trim(),ar=$('#fa').value.trim();if(!ti||!ar){alert(t('rq'));return}
 const f=$('#fi').files[0],im=f?await shrink(f):'';CD.unshift({ti,ar,tr:$('#fr').value.trim(),im});
 try{Q.cd=JSON.stringify(CD)}catch(e){CD.shift();alert('Storage full');return}build();open('duas')}
function delD(i){if(confirm(t('de')+'?')){CD.splice(i,1);Q.cd=JSON.stringify(CD);build();open('duas')}}
function cdHTML(d,i){return `<div class="dua" style="background:linear-gradient(135deg,#d9ecec,#fff9)" onclick="this.classList.toggle('o')">${d.im?`<img src="${d.im}" style="width:64px;height:64px;object-fit:cover;border-radius:12px">`:'<span class="e">🤲</span>'}<b style="flex:1">${esc(d.ti)}</b><div class="x"><div class="ar" style="font-size:${D.fs}px">${esc(d.ar)}</div>${D.ao?'':`<p>${esc(d.tr)}</p>`}<button class="btn" style="background:#b5483a" onclick="event.stopPropagation();delD(${i})">${t('de')}</button></div></div>`}
function aim(){const o=$('#co');if(!ST||HD==null)return;const d=((QB-HD+540)%360)-180,k=Math.abs(d)<8;
 o.textContent=k?t('ok'):(d>0?'➡️ ':'⬅️ ')+Math.abs(d).toFixed(0)+'°';o.style.background=k?'#1d8a4a':'#000a'}
async function cam(){const v=$('#cv'),o=$('#co');
 if(ST){ST.getTracks().forEach(x=>x.stop());ST=null;v.style.display=o.style.display='none';return}
 try{ST=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=ST;v.style.display=o.style.display='block';
 if(HD==null)comp();aim()}catch(e){alert('Camera: '+e.message+' (HTTPS required)')}}
wake();build();qib();tick();setInterval(tick,1000);
navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{load({la:p.coords.latitude,lo:p.coords.longitude});qib()},()=>{POS&&load(POS)});
if('serviceWorker'in navigator&&location.protocol!='file:')navigator.serviceWorker.register('sw.js');
